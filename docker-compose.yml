services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz_builder
    ports:
      - '5432:5432'
    volumes:
      - quiz-builder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz_builder']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quiz-builder-pgdata:
